name: Linux AppImage

on:
  workflow_dispatch:
  pull_request:
    paths: ['linux/**', '.github/workflows/appimage.yml']
  push:
    branches: [main]
    tags: ['v*']
    paths: ['linux/**', '.github/workflows/appimage.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install packaging and smoke-test dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          desktop-file-utils file libgirepository1.0-dev librsvg2-dev
          libgtk-3-dev python3 python3-gi xvfb
      - name: Validate packaging files
        run: |
          bash -n linux/appimage/build-appimage.sh
          sh -n linux/appimage/AppRun
          desktop-file-validate linux/MediaShelf.desktop
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('linux/appimage/earth.degenerate.MediaShelf.metainfo.xml')
          PY
      - name: Build AppImage
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'continuous' }}
        run: bash linux/appimage/build-appimage.sh
      - name: Inspect AppImage contents
        run: |
          APPIMAGE=$(find dist -name '*.AppImage' -print -quit)
          test -n "$APPIMAGE"
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -f squashfs-root/usr/share/mediashelf/mediashelf.py
          test -f squashfs-root/usr/lib/python3.10/dist-packages/gi/__init__.py
      - name: Smoke-test GTK startup
        run: |
          set +e
          APPIMAGE=$(find dist -name '*.AppImage' -print -quit)
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 8s xvfb-run -a "$APPIMAGE" >appimage-smoke.log 2>&1
          STATUS=$?
          set -e
          cat appimage-smoke.log
          test "$STATUS" -eq 124
          ! grep -E 'Traceback|ImportError|ModuleNotFoundError|error while loading shared libraries' appimage-smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: MediaShelf-AppImage-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MediaShelf-AppImage-x86_64
          path: dist
      - name: Create GitHub release and upload AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*.AppImage
          --repo "${GITHUB_REPOSITORY}" --title "MediaShelf ${GITHUB_REF_NAME}"
          --generate-notes
